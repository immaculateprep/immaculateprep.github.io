---
layout: default
---
<article class="post">
  <header class="page-head">
    <div class="wrap">
      <p class="post-meta">{{ page.category }}, {{ page.date | date: "%B %-d, %Y" }}</p>
      <h1>{{ page.title }}</h1>
    </div>
  </header>
  <div class="wrap narrow post-body">
    {% if page.image %}<img class="post-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}">{% endif %}
    {{ content }}
    <p><a class="text-link" href="{{ '/news-events/' | relative_url }}">Back to news and events</a></p>
  </div>
</article>
